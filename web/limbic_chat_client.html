<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LIMBIC-0 · External Chat Client</title>
  <style>
    :root {
      --bg: #0e100f;
      --surface: #151817;
      --surface-user: #1d2220;
      --border: rgba(236, 234, 228, 0.08);
      --border-focus: rgba(236, 234, 228, 0.20);
      --text: #eceae4;
      --text-dim: #98968f;
      --text-faint: #64635d;
      --alive: #68b88e;
      --resting: #d4a056;
      --danger: #d46a5e;
      --font-sans: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(14, 16, 15, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      min-width: 0;
    }

    .presence-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .presence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--alive);
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(104, 184, 142, 0.45);
      animation: pulse-breath 3.8s ease-in-out infinite;
    }

    .presence-dot.resting {
      background: var(--resting);
      box-shadow: 0 0 10px rgba(212, 160, 86, 0.38);
      animation-duration: 5.5s;
    }

    .presence-dot.offline {
      background: var(--danger);
      box-shadow: none;
      animation: none;
    }

    @keyframes pulse-breath {
      0%, 100% { opacity: 0.55; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .presence-name {
      font-size: 15px;
      font-weight: 560;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .presence-state {
      font-size: 12.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .endpoint-pill {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.16s ease, color 0.16s ease;
    }

    .endpoint-pill:hover {
      border-color: var(--border-focus);
      color: var(--text);
    }

    .tunnel-drawer {
      display: none;
      padding: 12px 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-direction: column;
    }

    .tunnel-drawer.open {
      display: flex;
    }

    .tunnel-hint {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.45;
    }

    .tunnel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    #tunnel-input {
      flex: 1 1 auto;
      min-width: 0;
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      outline: none;
    }

    #tunnel-input:focus {
      border-color: var(--border-focus);
    }

    #tunnel-save-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(236, 234, 228, 0.14);
      background: #eceae4;
      color: #111312;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-scroll {
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      min-width: 0;
    }

    .empty-greeting {
      margin: auto 0;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-faint);
      font-size: 14px;
      line-height: 1.7;
      user-select: none;
    }

    .msg-row {
      display: flex;
      width: 100%;
      min-width: 0;
      animation: fade-rise 0.22s ease-out;
    }

    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.soul {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 84%;
      min-width: 0;
      font-size: 15.2px;
      line-height: 1.68;
      letter-spacing: -0.01em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--surface-user);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 18px 18px 4px 18px;
    }

    .msg-row.soul .bubble {
      background: transparent;
      color: var(--text);
      padding: 4px 2px;
      max-width: 92%;
    }

    .subtle-whisper {
      font-size: 13px;
      color: var(--text-dim);
      font-style: normal;
      opacity: 0.8;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 4px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      opacity: 0.35;
      animation: dot-blink 1.3s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes dot-blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 0.9; transform: translateY(-2px); }
    }

    .composer-area {
      padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      border-top: 1px solid var(--border);
      min-width: 0;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 8px 10px 8px 16px;
      transition: border-color 0.18s ease;
      min-width: 0;
    }

    .composer-box:focus-within {
      border-color: var(--border-focus);
    }

    #chat-input {
      flex: 1 1 auto;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      resize: none;
      max-height: 150px;
      padding: 4px 0;
    }

    #chat-input::placeholder {
      color: var(--text-faint);
    }

    #send-btn {
      flex-shrink: 0;
      height: 36px;
      padding: 0 16px;
      border-radius: 18px;
      border: 1px solid rgba(236, 234, 228, 0.14);
      background: #eceae4;
      color: #111312;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    #send-btn:disabled {
      opacity: 0.32;
      cursor: default;
    }

    #send-btn:not(:disabled):active {
      transform: scale(0.97);
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 13px 16px 12px;
      }

      .tunnel-drawer {
        padding: 10px 16px;
      }

      .chat-scroll {
        padding: 20px 16px 16px;
        gap: 16px;
      }

      .bubble {
        font-size: 15px;
      }

      .msg-row.user .bubble {
        max-width: 88%;
      }

      .msg-row.soul .bubble {
        max-width: 96%;
      }

      .composer-area {
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="presence-wrap">
        <span id="presence-dot" class="presence-dot offline" aria-hidden="true"></span>
        <span class="presence-name">결</span>
      </div>
      <div class="topbar-right">
        <span id="presence-state" class="presence-state">코랩 터널 대기 중</span>
        <button id="endpoint-pill" class="endpoint-pill" type="button" title="코랩 Cloudflare 터널 서버 주소 설정">서버 연결</button>
      </div>
    </header>

    <section id="tunnel-drawer" class="tunnel-drawer open" aria-label="서버 주소 설정">
      <div class="tunnel-hint">Google Colab(TPU v5e-1)에서 출력된 Cloudflare 주소(<code>https://xxxx.trycloudflare.com</code>)를 붙여넣으세요. 코랩 밖(PC·모바일·정적 호스팅) 어디서든 결이와 직통 연결됩니다.</div>
      <form id="tunnel-form" class="tunnel-row">
        <input id="tunnel-input" type="url" placeholder="https://example-words.trycloudflare.com" autocomplete="off" spellcheck="false" />
        <button id="tunnel-save-btn" type="submit">연결</button>
      </form>
    </section>

    <main id="chat-scroll" class="chat-scroll" aria-live="polite">
      <div id="empty-greeting" class="empty-greeting">
        아무 말이나 편하게 건네 보세요.
      </div>
    </main>

    <footer class="composer-area">
      <form id="chat-form" class="composer-box">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="말을 건네세요..."
          autocomplete="off"
          autocorrect="on"
        ></textarea>
        <button id="send-btn" type="submit" disabled>전송</button>
      </form>
    </footer>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "limbic0_server_url";
      const chatScroll = document.getElementById("chat-scroll");
      const emptyGreeting = document.getElementById("empty-greeting");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const sendBtn = document.getElementById("send-btn");
      const presenceDot = document.getElementById("presence-dot");
      const presenceState = document.getElementById("presence-state");
      const endpointPill = document.getElementById("endpoint-pill");
      const tunnelDrawer = document.getElementById("tunnel-drawer");
      const tunnelForm = document.getElementById("tunnel-form");
      const tunnelInput = document.getElementById("tunnel-input");

      let primarySoulId = "";
      let isGenerating = false;

      function cleanBaseUrl(raw) {
        if (!raw || typeof raw !== "string") return "";
        return raw.trim().replace(/\/+$/, "");
      }

      const params = new URLSearchParams(window.location.search);
      const queryServer = cleanBaseUrl(params.get("server") || params.get("api") || "");
      const injectedServer = cleanBaseUrl(window.LIMBIC_DEFAULT_SERVER_URL || "");
      let storedServer = "";
      try {
        storedServer = cleanBaseUrl(window.localStorage.getItem(STORAGE_KEY) || "");
      } catch (_e) {
        storedServer = "";
      }

      let apiBase = queryServer || injectedServer || storedServer;
      if (queryServer) {
        try { window.localStorage.setItem(STORAGE_KEY, queryServer); } catch (_e) {}
      }

      function apiUrl(path) {
        return apiBase ? (apiBase + path) : path;
      }

      function updateEndpointUi(connectedOk) {
        if (apiBase) {
          try {
            const hostShort = new URL(apiBase).host.replace(".trycloudflare.com", "");
            endpointPill.textContent = connectedOk ? ("터널 · " + hostShort.slice(0, 14)) : "터널 재설정";
          } catch (_e) {
            endpointPill.textContent = "터널 설정";
          }
          if (connectedOk) {
            tunnelDrawer.classList.remove("open");
          }
        } else {
          endpointPill.textContent = "서버 연결";
          tunnelDrawer.classList.add("open");
        }
      }

      endpointPill.addEventListener("click", () => {
        tunnelInput.value = apiBase;
        tunnelDrawer.classList.toggle("open");
        if (tunnelDrawer.classList.contains("open")) {
          tunnelInput.focus();
        }
      });

      tunnelForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const cleaned = cleanBaseUrl(tunnelInput.value);
        apiBase = cleaned;
        try {
          if (cleaned) {
            window.localStorage.setItem(STORAGE_KEY, cleaned);
          } else {
            window.localStorage.removeItem(STORAGE_KEY);
          }
        } catch (_err) {}
        await pollPresence();
      });

      function normalizeHumanText(raw) {
        if (!raw) return "";
        return raw
          .replace(/^#{1,6}\s+/gm, "")
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/\n{3,}/g, "\n\n");
      }

      function scrollToBottom() {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }

      function resizeTextarea() {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(150, chatInput.scrollHeight) + "px";
        sendBtn.disabled = isGenerating || chatInput.value.trim().length === 0;
      }

      async function pollPresence() {
        if (!apiBase) {
          presenceDot.className = "presence-dot offline";
          presenceState.textContent = "코랩 터널 대기 중";
          updateEndpointUi(false);
          return;
        }
        try {
          const res = await fetch(apiUrl("/api/health"), { cache: "no-store" });
          if (!res.ok) throw new Error("status " + res.status);
          const data = await res.json();
          if (data.primary_soul_id) {
            primarySoulId = data.primary_soul_id;
          } else if (Array.isArray(data.available_souls) && data.available_souls.length > 0) {
            primarySoulId = data.available_souls[0];
          }
          const evo = data.autonomous_evolution || {};
          if (isGenerating) {
            presenceDot.className = "presence-dot";
            presenceState.textContent = "대답 고르는 중";
          } else if (evo.is_evolving_now) {
            presenceDot.className = "presence-dot resting";
            presenceState.textContent = "혼자 생각 정리하는 중";
          } else {
            presenceDot.className = "presence-dot";
            presenceState.textContent = "깨어 있음";
          }
          updateEndpointUi(true);
        } catch (_err) {
          presenceDot.className = "presence-dot offline";
          presenceState.textContent = "터널 연결 확인 필요";
          updateEndpointUi(false);
        }
      }

      function appendMessageRow(role, initialHtml = "") {
        if (emptyGreeting && emptyGreeting.parentNode) {
          emptyGreeting.remove();
        }
        const row = document.createElement("div");
        row.className = "msg-row " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (initialHtml) {
          bubble.innerHTML = initialHtml;
        }
        row.appendChild(bubble);
        chatScroll.appendChild(row);
        scrollToBottom();
        return bubble;
      }

      async function sendMessage(text) {
        if (!text || isGenerating) return;
        if (!apiBase) {
          tunnelDrawer.classList.add("open");
          tunnelInput.focus();
          return;
        }
        isGenerating = true;
        sendBtn.disabled = true;
        presenceDot.className = "presence-dot";
        presenceState.textContent = "대답 고르는 중";

        const userBubble = appendMessageRow("user");
        userBubble.textContent = text;

        const soulBubble = appendMessageRow(
          "soul",
          '<span class="typing-dots"><span></span><span></span><span></span></span>'
        );

        let rawReply = "";
        let receivedAnyToken = false;

        try {
          const payload = {
            message: text,
            steer_enabled: true,
            steer_gain: 1.0,
            agent_mode: true,
            enable_thinking: false,
            max_new_tokens: 768,
            temperature: 0.72,
            use_history: true
          };
          if (primarySoulId) {
            payload.soul_id = primarySoulId;
          }

          const resp = await fetch(apiUrl("/api/chat/stream"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!resp.ok || !resp.body) {
            throw new Error("HTTP " + resp.status);
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const frames = buffer.split("\n\n");
            buffer = frames.pop() || "";

            for (const frame of frames) {
              const line = frame.trim();
              if (!line.startsWith("data:")) continue;
              const jsonStr = line.slice(5).trim();
              if (!jsonStr) continue;
              let evt;
              try {
                evt = JSON.parse(jsonStr);
              } catch (_e) {
                continue;
              }

              if ((evt.type === "tool_call" || evt.type === "tool_start") && !receivedAnyToken) {
                soulBubble.innerHTML = '<span class="subtle-whisper">잠깐 찾아보는 중...</span>';
                scrollToBottom();
              } else if (evt.type === "delta" || evt.type === "token") {
                const piece = evt.delta !== undefined ? evt.delta : (evt.text || "");
                if (piece) {
                  receivedAnyToken = true;
                  rawReply += piece;
                  soulBubble.textContent = normalizeHumanText(rawReply);
                  scrollToBottom();
                }
              } else if (evt.type === "done") {
                if (!receivedAnyToken && evt.reply) {
                  rawReply = evt.reply;
                }
                const cleaned = normalizeHumanText(rawReply).trim();
                soulBubble.textContent = cleaned || "...";
                scrollToBottom();
              }
            }
          }

          if (!receivedAnyToken && !rawReply.trim()) {
            soulBubble.textContent = "...";
          }
        } catch (_err) {
          soulBubble.innerHTML = '<span class="subtle-whisper">잠시 말이 끊겼어요. 코랩 Cloudflare 터널 주소를 확인하거나 다시 한 번 말해 줄래요?</span>';
        } finally {
          isGenerating = false;
          presenceState.textContent = "깨어 있음";
          resizeTextarea();
          chatInput.focus();
        }
      }

      chatInput.addEventListener("input", resizeTextarea);

      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          const val = chatInput.value.trim();
          if (val && !isGenerating) {
            chatInput.value = "";
            resizeTextarea();
            sendMessage(val);
          }
        }
      });

      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = chatInput.value.trim();
        if (val && !isGenerating) {
          chatInput.value = "";
          resizeTextarea();
          sendMessage(val);
        }
      });

      tunnelInput.value = apiBase;
      updateEndpointUi(false);
      pollPresence();
      setInterval(pollPresence, 10000);
    })();
  </script>
</body>
</html>
