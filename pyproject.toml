[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limbic-zero"
version = "0.5.0"
description = "Project LIMBIC-0: Continuous-Time Homeostatic Affective Architecture, Wild Instinct Evolution, Matured LLM Soul Capsules & Gemma-4-12B-IT Mid-Layer Vocal Cord Surgery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=1.10.0",
    "rich>=13.7.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/limbic_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
